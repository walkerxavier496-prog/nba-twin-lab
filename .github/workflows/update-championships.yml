name: Refresh NBA championship history
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 3'
  push:
    branches: [main]
    paths:
      - build_championships.py
      - tests/test_championships.py
      - championship/index.html
      - .github/workflows/update-championships.yml
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-championships
  cancel-in-progress: false
jobs:
  championships:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_championships.py
      - name: Syntax check Championship Lab
        run: |
          python -c "from pathlib import Path; s=Path('championship/index.html').read_text(); Path('/tmp/nba_championship_ui.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/nba_championship_ui.js
      - run: python build_championships.py
      - name: Publish validated title history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/champions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated NBA champions and Finals MVPs'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
