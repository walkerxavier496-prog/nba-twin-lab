name: Refresh NBA championship history
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 3'
  push:
    branches: [main]
    paths:
      - build_championships.py
      - tests/test_championships.py
      - championship/index.html
      - .github/workflows/update-championships.yml
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-championships
  cancel-in-progress: false
jobs:
  championships:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest -q tests/test_championships.py
      - name: Syntax check Championship Lab
        run: |
          python -c "from pathlib import Path; s=Path('championship/index.html').read_text(); Path('/tmp/nba_championship_ui.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/nba_championship_ui.js
      - run: python build_championships.py
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: update-championships
