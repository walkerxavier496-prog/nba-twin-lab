name: Validate and refresh NBA Twin Lab data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 13 * * *'
  push:
    branches: [main]
    paths: ['build_data.py', 'requirements.txt', 'tests/test_build_data.py', '.github/workflows/update-data.yml']
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-data
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest -q
      - run: python build_data.py
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: update-data
