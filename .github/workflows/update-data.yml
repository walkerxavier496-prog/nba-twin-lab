name: Validate and refresh NBA Twin Lab data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 13 * * *'
  push:
    branches: [main]
    paths: ['build_data.py', 'requirements.txt', 'tests/test_build_data.py', '.github/workflows/update-data.yml']
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python build_data.py
      - name: Publish validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seasons.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated NBA data'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo 'Could not publish after 5 non-destructive retries' >&2
            exit 1
          fi
