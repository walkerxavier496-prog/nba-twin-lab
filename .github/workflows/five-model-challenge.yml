name: Five Model Challenge audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/five-model-challenge.yml'
      - 'scripts/five_model_challenge.cjs'
      - 'scripts/v8_research.cjs'
      - 'scripts/game_science.cjs'
      - 'scripts/roster_research.cjs'
      - 'predict/engine.js'
      - 'predict/science.js'
      - 'predict/roster.js'
      - 'data/v7-intelligence.json'
      - 'data/rotation-history.json'
      - 'data/historical-games.json'
      - 'tests/five_model_challenge.test.cjs'
      - 'tests/daily_audit.test.cjs'
      - 'tests/site_navigation.test.cjs'

permissions:
  contents: write

concurrency:
  group: nba-twin-lab-five-model-challenge
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test challenge chronology and weighting
        run: node --test tests/five_model_challenge.test.cjs
      - name: Test Melbourne time handling
        run: node --test --test-name-pattern='Melbourne date' tests/daily_audit.test.cjs
      - name: Test immutable lock integrity
        run: node --test --test-name-pattern='integrity detects' tests/daily_audit.test.cjs
      - name: Test results and DNP scoring
        run: node --test --test-name-pattern='ESPN result|review metrics' tests/daily_audit.test.cjs
      - name: Test immutable pretip forecast and post-tip rejection
        run: node --test --test-name-pattern='historical pretip forecast' tests/daily_audit.test.cjs
      - name: Test challenge site routes
        run: node --test tests/site_navigation.test.cjs
      - name: Rebuild common-game challenge
        run: node scripts/five_model_challenge.cjs --simulations=400
      - name: Verify generated report
        run: node --test tests/five_model_challenge.test.cjs
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: five-model-challenge
