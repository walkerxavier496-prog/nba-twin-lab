name: Validate and refresh NBA game predictions
on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * *'
  push:
    branches: [main]
    paths:
      - build_predictions.py
      - predict/engine.js
      - predict/app.js
      - scripts/model_report.cjs
      - tests/monte_carlo.test.cjs
      - tests/model_report.integration.test.cjs
      - data/context.json
      - mvp/index.html
      - tests/prediction_engine.test.cjs
      - tests/test_predictions.py
      - .github/workflows/update-predictions.yml
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-predictions
  cancel-in-progress: false
jobs:
  predictions:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest -q tests/test_predictions.py
      - run: node --test tests/*.test.cjs
      - run: node --check predict/engine.js && node --check predict/app.js
      - name: Syntax check MVP Lab inline JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('mvp/index.html').read_text(); Path('/tmp/nba_mvp_ui.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/nba_mvp_ui.js
      - run: python build_predictions.py
      - name: Audit walk-forward forecast accuracy
        run: node scripts/model_report.cjs
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: update-predictions
