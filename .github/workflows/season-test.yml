name: Opening-night NBA season backtest
on:
  workflow_dispatch:
  schedule:
    - cron: '55 12 * * *'
  push:
    branches: [main]
    paths:
      - build_preseason.py
      - scripts/season_backtest.cjs
      - predict/engine.js
      - season-test/index.html
      - tests/test_preseason.py
      - tests/season_backtest.test.cjs
      - .github/workflows/season-test.yml
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-season-test
  cancel-in-progress: false
jobs:
  backtest:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest -q tests/test_preseason.py
      - run: node --test tests/prediction_engine.test.cjs tests/season_backtest.test.cjs
      - name: Validate season test UI
        run: |
          python -c "from pathlib import Path; s=Path('season-test/index.html').read_text(); Path('/tmp/nba_season_test.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/nba_season_test.js
      - name: Import verified preseason games
        run: python build_preseason.py
      - name: Generate projected vs actual standings
        run: node scripts/season_backtest.cjs
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: season-test
