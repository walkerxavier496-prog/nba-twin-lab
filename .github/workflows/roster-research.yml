name: Roster turnover walk-forward audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_v7_intelligence.py
      - predict/roster.js
      - scripts/roster_research.cjs
      - tests/roster_research.test.cjs
      - .github/workflows/roster-research.yml
      - data/v7-intelligence.json
      - data/rotation-history.json
      - data/historical-games.json
permissions:
  contents: write
concurrency:
  group: nba-twin-roster-research
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source builder
        run: python -m py_compile build_v7_intelligence.py
      - name: Generate compact historical rotations when missing
        run: |
          if [ ! -s data/rotation-history.json ]; then
            pip install -r requirements.txt
            python build_v7_intelligence.py --output /tmp/v7-intelligence.json --current-output /tmp/v7-current.json --player-report-output /tmp/v9-player-report.json --rotation-history-output data/rotation-history.json
          fi
      - name: Verify source and safety tests
        run: |
          node --check predict/roster.js
          node --check predict/app.js
          node --check scripts/roster_research.cjs
          node --test tests/roster_research.test.cjs tests/v8_research.test.cjs tests/site_navigation.test.cjs
      - name: Fit strictly earlier seasons and test rolling origin
        run: node scripts/roster_research.cjs
      - name: Verify audit, coverage and finite probabilities
        run: |
          node - <<'JS'
          const io=require('./scripts/research_io.cjs');
          const r=JSON.parse(require('node:fs').readFileSync(io.outputPath('roster-research-report.json'))),p=JSON.parse(require('node:fs').readFileSync(io.outputPath('roster-priors.json')));
          if(!r.strict_no_future_data||r.status!=='research_only_not_promoted'||!p.strict_no_future_data)throw Error('Unverified research');
          if(r.sample.games!==6221||r.sample.rolling!==4920||r.sample.fresh!==71)throw Error('Wrong historical sample');
          if(Object.keys(p.teams).length!==30||p.target_season!==2027)throw Error('Missing prior team rotations');
          for(const [k,m] of Object.entries(r.models))if(!Number.isFinite(m.rolling.brier)||!Number.isFinite(m.rolling.logLoss))throw Error('Invalid '+k+' metrics');
          console.log('Research only; no live model promotion');
          JS
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: roster-research
