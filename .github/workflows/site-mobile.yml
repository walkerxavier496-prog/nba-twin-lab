name: Responsive website checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/site-shell.css'
      - 'assets/site-shell.js'
      - 'assets/courtside.css'
      - 'assets/court-lines.svg'
      - 'assets/home.js'
      - 'assets/team-media.js'
      - 'assets/live-scoreboard.js'
      - 'assets/live-desk.js'
      - 'assets/boxscore-plus.js'
      - 'assets/site-nav.js'
      - 'assets/nav-v15.css'
      - 'assets/game-page.js'
      - 'assets/game-page.css'
      - 'game/**'
      - 'league/**'
      - 'assets/live-desk.css'
      - 'assets/v12.css'
      - 'assets/dark-v13.css'
      - 'assets/team-prefs.js'
      - 'assets/sortable-tables.js'
      - 'assets/sortable-v17.css'
      - 'assets/watchlist.js'
      - 'assets/watchlist-v17.css'
      - 'watchlist/**'
      - 'assets/current-players.js'
      - 'challenge/**'
      - 'audit/index.html'
      - 'audit/styles.css'
      - 'predict/index.html'
      - 'predict/roster-integrity.js'
      - 'predict/roster-strength.js'
      - 'scripts/build_official_availability.py'
      - 'tests/roster_strength_v18.test.cjs'
      - 'tests/test_official_availability.py'
      - 'data/availability-current.json'
      - 'tests/roster_integrity_v18.test.cjs'
      - 'predict/styles.css'
      - 'models/index.html'
      - 'twins/index.html'
      - 'team-intelligence/index.html'
      - 'player-stats/index.html'
      - 'history/index.html'
      - 'research/index.html'
      - 'tests/mobile_design.test.cjs'
      - 'tests/courtside.test.cjs'
      - 'tests/v12_remodel.test.cjs'
      - 'tests/media_assets.test.cjs'
      - 'tests/live_scoreboard.test.cjs'
      - 'tests/live_desk.test.cjs'
      - 'tests/boxscore_advanced.test.cjs'
      - 'tests/game_centre.test.cjs'
      - 'tests/league_v17.test.cjs'
      - 'tests/watchlist_v17.test.cjs'
      - 'tests/fan_team_dark.test.cjs'
      - 'tests/site_navigation.test.cjs'
      - 'tests/challenge_daily.test.cjs'
      - '.github/workflows/site-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser scripts
        run: |
          node --check assets/site-shell.js
          node --check assets/home.js
          node --check assets/team-media.js
          node --check assets/live-scoreboard.js
          node --check assets/live-desk.js
          node --check assets/boxscore-plus.js
          node --check assets/site-nav.js
          node --check assets/game-page.js
          node --check league/standings.js
          node --check league/cup-2026.js
          node --check assets/sortable-tables.js
          node --check assets/watchlist.js
          node --check watchlist/app.js
          node --check assets/team-prefs.js
          node --check assets/current-players.js
          node --check team-intelligence/app.js
          node --check challenge/daily.js
          node --check challenge/app.js
          node --check predict/app.js
          node --check predict/roster-integrity.js
          node --check predict/roster-strength.js
      - name: Test responsive routes and original pregame data safeguards
        run: node --test tests/mobile_design.test.cjs tests/site_navigation.test.cjs tests/challenge_daily.test.cjs tests/courtside.test.cjs tests/v12_remodel.test.cjs tests/media_assets.test.cjs tests/live_scoreboard.test.cjs tests/live_desk.test.cjs tests/boxscore_advanced.test.cjs tests/fan_team_dark.test.cjs tests/game_centre.test.cjs tests/league_v17.test.cjs tests/watchlist_v17.test.cjs tests/roster_integrity_v18.test.cjs tests/roster_strength_v18.test.cjs
