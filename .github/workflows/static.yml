name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits do not emit another push workflow. Successful
  # producers hand off receipts; Pages is deliberately not in this list.
  workflow_run:
    workflows:
      - One-off pregame six-model challenge sidecar
      - Daily immutable prediction and results ledger
      - Five Model Challenge audit
      - Basketball Science walk-forward audit
      - Roster turnover walk-forward audit
      - Opening-night NBA season backtest
      - Refresh NBA championship history
      - Refresh NBA team context and MVP voting
      - Validate and refresh NBA Twin Lab data
      - Validate and refresh NBA game predictions
      - V7 player and matchup intelligence audit
      - V8 direct player impact research audit
      - V9 player stat projections and audit
      - Append-only NBA player-game history
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["schedule","push","workflow_dispatch"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      revision: ${{ steps.target.outputs.revision }}
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find publication receipt from this successful run attempt
        if: github.event_name == 'workflow_run'
        id: receipt
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id
            });
            const name = `publication-receipt-${run.run_attempt}`;
            const artifact = artifacts.find(a => a.name === name && !a.expired);
            core.setOutput('found', artifact ? 'true' : 'false');
            if (!artifact) core.notice('No publication in this run; no deployment requested.');
            if (artifact) {
              if (artifact.size_in_bytes > 65536) throw new Error('Oversized publication receipt');
              const zip = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              const bytes = Buffer.from(zip.data);
              if (bytes.length > 65536) throw new Error('Oversized receipt archive');
              require('node:fs').writeFileSync(
                require('node:path').join(process.env.RUNNER_TEMP, 'publication-receipt.zip'), bytes);
            }
      - name: Select exact published revision; skip superseded revisions
        id: target
        env:
          HAS_RECEIPT: ${{ steps.receipt.outputs.found }}
        run: python scripts/deployment.py select
      - uses: actions/checkout@v4
        if: steps.target.outputs.deploy == 'true'
        with:
          ref: ${{ steps.target.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.target.outputs.deploy == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.target.outputs.deploy == 'true'
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        if: steps.target.outputs.deploy == 'true'
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Validate the exact revision to be deployed
        if: steps.target.outputs.deploy == 'true'
        run: bash scripts/validate_release.sh
      - name: Package validated revision and freshness metadata
        if: steps.target.outputs.deploy == 'true'
        env:
          RELEASE_REVISION: ${{ steps.target.outputs.revision }}
          HAS_RECEIPT: ${{ steps.receipt.outputs.found }}
        run: python scripts/deployment.py package
      - uses: actions/configure-pages@v5
        if: steps.target.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.target.outputs.deploy == 'true'
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prevent an older queued release from replacing newer main
        id: current
        uses: actions/github-script@v7
        env:
          RELEASE_REVISION: ${{ needs.build.outputs.revision }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            core.setOutput('deploy', data.commit.sha === process.env.RELEASE_REVISION ? 'true' : 'false');
            if (data.commit.sha !== process.env.RELEASE_REVISION)
              core.notice('Release superseded; the newer main revision must deploy instead.');
      - name: Deploy validated Pages artifact
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
