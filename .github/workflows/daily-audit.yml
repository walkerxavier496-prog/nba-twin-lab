name: Daily immutable prediction and results ledger

on:
  # Run this exact audited publication pipeline after its own definition changes.
  # Restrict push to this workflow file so data publication commits cannot loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-audit.yml'
      - 'tests/home_rail_states.test.cjs'
      - 'scripts/daily_tracker.cjs'
      - 'tests/daily_audit.test.cjs'
  # The game-data producer can finish after an audit starts. Re-run this
  # audited lock pipeline on its successful completion, using fresh main.
  workflow_run:
    workflows:
      - Validate and refresh NBA game predictions
      - V9 player stat projections and audit
    types: [completed]
  workflow_dispatch:
    inputs:
      melbourne_date:
        description: Optional Melbourne date (YYYY-MM-DD); normally discovered automatically
        required: false
        type: string
  schedule:
    # GitHub cron is UTC and cannot follow Australian DST. Poll every 15 minutes;
    # each final game is append-only and idempotent, while incomplete boxes stay pending.
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: nba-twin-lab-daily-audit
  cancel-in-progress: false

jobs:
  track:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
      TRACKER_DATE: ${{ inputs.melbourne_date }}
      TRACKER_SIMULATIONS: '20000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject failed or non-main source refresh
        if: github.event_name == 'workflow_run'
        env:
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          test "$SOURCE_CONCLUSION" = success
          test "$SOURCE_BRANCH" = main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official NBA report PDF parser
        run: python -m pip install --disable-pip-version-check 'pdfplumber>=0.11,<0.13'
      - name: Test official source parsing and pretip roster/strength integrity
        run: |
          python -m unittest discover -s tests -p test_official_availability.py -v
          node --test tests/roster_strength_v18.test.cjs
      - name: Refresh official NBA roster/injury evidence (fail closed)
        run: python scripts/build_official_availability.py
      - name: Test lock, timezone and scoring rules
        run: node --test tests/challenge_daily.test.cjs tests/daily_audit.test.cjs tests/prediction_engine.test.cjs tests/monte_carlo.test.cjs tests/site_navigation.test.cjs tests/roster_integrity_v18.test.cjs
      - name: Lock eligible slate or ingest each complete final independently
        run: node scripts/daily_tracker.cjs run
      - name: Verify separately locked 31 Oct six-model sidecar
        run: node scripts/challenge_supplement.cjs verify
      - name: Verify immutable artifacts and derived ledger
        run: node scripts/daily_tracker.cjs verify
      # Anchoring must never block locking or publication, so these steps are
      # non-fatal. Missing/failed timestamps are retried on the next 15-minute run.
      - name: Record lock anchors (hash of each pre-tip lock)
        continue-on-error: true
        run: node scripts/anchor_locks.cjs run
      - name: Install OpenTimestamps client
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check opentimestamps-client
      - name: Stamp and upgrade independent OpenTimestamps proofs
        continue-on-error: true
        run: node scripts/anchor_locks.cjs ots-sync
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: daily-audit
