name: One-off pregame six-model challenge sidecar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/challenge-supplement-2026-10-31.yml'
      - 'scripts/challenge_supplement.cjs'
      - 'tests/challenge_daily.test.cjs'
      - 'tests/daily_audit.test.cjs'
      - 'tests/five_model_challenge.test.cjs'

permissions:
  contents: write

concurrency:
  group: nba-twin-2026-10-31-shadow
  cancel-in-progress: false

jobs:
  lock:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and immutable-original tests
        run: |
          node --check scripts/challenge_supplement.cjs
          node --check challenge/daily.js
          node --test tests/challenge_daily.test.cjs tests/five_model_challenge.test.cjs tests/daily_audit.test.cjs
      - name: Create once, only when genuinely before the first tip
        run: node scripts/challenge_supplement.cjs lock
      - name: Validate SHA256-integrity and game alignment
        run: node scripts/challenge_supplement.cjs verify
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: challenge-supplement-2026-10-31
