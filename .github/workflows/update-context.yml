name: Refresh NBA team context and MVP voting
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * 2'
  push:
    branches: [main]
    paths:
      - build_context.py
      - tests/test_predictions.py
      - .github/workflows/update-context.yml
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-context
  cancel-in-progress: false
jobs:
  context:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest -q tests/test_predictions.py
      - run: python build_context.py
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: update-context
