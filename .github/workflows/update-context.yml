name: Refresh NBA team context and MVP voting
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * 2'
  push:
    branches: [main]
    paths:
      - build_context.py
      - tests/test_predictions.py
      - .github/workflows/update-context.yml
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-context
  cancel-in-progress: false
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_predictions.py
      - run: python build_context.py
      - name: Publish only validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/context.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated NBA team context and MVP votes'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo 'Could not publish after 5 non-destructive retries' >&2
            exit 1
          fi
