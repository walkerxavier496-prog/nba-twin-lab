name: V8 direct player impact research audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/v8_research.cjs
      - tests/v8_research.test.cjs
      - research/**
      - .github/workflows/v8-research.yml
      - predict/engine.js
      - data/v7-intelligence.json
      - data/historical-games.json
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-v8
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    env:
      NBA_REVIEW_OUTPUT_DIR: research-reviews/chronology-v1/runs/${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate experimental audit
        run: |
          node --check scripts/v8_research.cjs
          node --check research/live.js
          node --test tests/v8_research.test.cjs
      - name: Run 6,221 strict pregame predictions
        run: node scripts/v8_research.cjs
      - name: Publish validated data and deployment receipt
        uses: ./.github/actions/publish-data
        with:
          workflow: v8-research
