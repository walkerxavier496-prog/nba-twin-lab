name: V8 direct player impact research audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/v8_research.cjs
      - tests/v8_research.test.cjs
      - .github/workflows/v8-research.yml
      - predict/engine.js
      - data/v7-intelligence.json
      - data/historical-games.json
permissions:
  contents: write
concurrency:
  group: nba-twin-lab-v8
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate experimental audit
        run: |
          node --check scripts/v8_research.cjs
          node --test tests/v8_research.test.cjs
      - name: Run 6,221 strict pregame predictions
        run: node scripts/v8_research.cjs
      - name: Publish audited report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v8-research-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V8 rolling-origin direct player impact research'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
