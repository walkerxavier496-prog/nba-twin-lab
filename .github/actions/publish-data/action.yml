name: Publish validated data
description: Commit all declared outputs, validate the exact revision and issue a Pages receipt
inputs:
  workflow:
    description: Producer key in scripts/publication.json
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: python -m pip install -r requirements.txt -r requirements-test.txt
    - name: Commit, validate and publish exact revision
      shell: bash
      env:
        PRODUCER: ${{ inputs.workflow }}
      run: python scripts/publish_data.py "$PRODUCER" --receipt "$RUNNER_TEMP/publication-receipt/receipt.json"
    - name: Hand exact published revision to Pages
      uses: actions/upload-artifact@v4
      with:
        name: publication-receipt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/publication-receipt/receipt.json
        if-no-files-found: error
        retention-days: 7
